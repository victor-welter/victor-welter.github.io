<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfólio profissional de Victor Welter, Engenheiro de Computação.">
  <meta property="og:title" content="Victor Welter">
  <meta property="og:description" content="Portfólio profissional de Victor Welter, Engenheiro de Computação.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://victor-welter.github.io/">
  <!-- TODO: add og:image once a share banner exists (Phase 4) -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Victor Welter">
  <meta name="twitter:description" content="Portfólio profissional de Victor Welter, Engenheiro de Computação.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Victor Welter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Victor Welter</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value of the flag below is set by the build process.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadApplication({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
